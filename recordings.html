<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenJam - Recordings History</title>
<style>
  :root {
    /* tokens:start */
  --bg:#0f1115; --bg2:#0b0d12; --panel:#171a21; --panel2:#1d212b;
  --line:#2a2f3a; --line-soft:#212632;
  --fg:#e6e9ef; --muted:#8b93a3; --dim:#5b6472;
  --accent:#6ea8fe; --accent2:#58a6ff; --blue:var(--accent2); --accent-ink:#0b0d12;
  --green:#3fb950; --gold:#d29922; --orange:var(--gold); --terra:#d97757;
  --red:#f85149; --violet:#bc8cff; --audio:#1d2b45;
  /* tokens:end */
    --card: linear-gradient(180deg,#1b1f28,#141821);
    --sans: -apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,Roboto,sans-serif;
    --mono: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13.5px/1.55 var(--sans);
    padding: 24px 20px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  .container {
    width: 100%;
    max-width: 980px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    gap: 12px;
  }

  .branding {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h1 {
    font-size: 18px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 9px;
  }

  h1::before {
    content: '🍓🫐🍇🍒';
    font-size: 14px;
  }

  .badge {
    background: var(--panel2);
    border: 1px solid var(--line);
    color: var(--accent);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    font-weight: 600;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .btn-nav {
    background: var(--panel2);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: background .15s ease;
  }
  .btn-nav:hover { background: var(--line); }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }

  .stat-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .stat-label {
    font-size: 11.5px;
    color: var(--muted);
    font-family: var(--mono);
    text-transform: uppercase;
    letter-spacing: .05em;
  }

  .stat-val {
    font-size: 22px;
    font-weight: 700;
    color: var(--fg);
  }

  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  #search-box {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    color: var(--fg);
    width: 320px;
    outline: none;
    transition: border-color .15s ease;
  }
  #search-box:focus { border-color: var(--accent); }

  .table-wrapper {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }

  th, td {
    padding: 13px 18px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }

  th {
    background: var(--panel2);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    font-weight: 600;
  }

  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(255, 255, 255, 0.02); }

  .domain-badge {
    display: inline-block;
    background: rgba(110, 168, 254, 0.12);
    color: var(--accent);
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 700;
    font-family: var(--mono);
    font-size: 12px;
    margin-bottom: 3px;
  }

  .page-title {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--fg);
    text-decoration: none;
    display: block;
    max-width: 380px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .page-title:hover { color: var(--accent); }

  .page-url {
    font-size: 11px;
    color: var(--dim);
    text-decoration: none;
    display: block;
    max-width: 380px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    margin-top: 2px;
  }
  .page-url:hover { color: var(--muted); }

  .timestamp-cell {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .time-rel {
    display: block;
    font-size: 10.5px;
    color: var(--dim);
    margin-top: 2px;
  }

  .meta-tag {
    font-size: 10.5px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: var(--mono);
  }
  .tag-replay { background: rgba(110,168,254,.15); color: var(--accent); }
  .tag-audio { background: rgba(63,185,80,.15); color: var(--green); }
  .tag-github { background: rgba(210,153,34,.15); color: var(--gold); }

  .actions-cell {
    text-align: right;
    white-space: nowrap;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    align-items: center;
  }

  .btn-action {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all .15s ease;
  }
  .btn-action.primary {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
  }
  .btn-action.primary:hover { background: #8bbcff; }
  .btn-action.secondary {
    background: var(--panel2);
    color: var(--fg);
  }
  .btn-action.secondary:hover { background: var(--line); }

  .empty-state {
    padding: 48px 20px;
    text-align: center;
    color: var(--muted);
  }
  .empty-state h3 { font-size: 15px; color: var(--fg); margin-bottom: 6px; }
  .empty-state p { font-size: 12.5px; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="branding">
      <h1>OpenJam Recordings</h1>
      <span class="badge">History &amp; Published Sessions</span>
    </div>
    <div class="header-actions">
      <a href="options.html" class="btn-nav">⚙ Settings</a>
    </div>
  </header>

  <div class="stats-grid">
    <div class="stat-card">
      <span class="stat-label">Total Recordings</span>
      <span class="stat-val" id="stat-total">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Unique Websites</span>
      <span class="stat-val" id="stat-domains">0</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Published to GitHub Pages</span>
      <span class="stat-val" id="stat-published">0</span>
    </div>
  </div>

  <div class="toolbar">
    <span id="showing-count" style="font-size: 12.5px; color: var(--muted);">Loading recordings...</span>
    <input type="text" id="search-box" placeholder="Filter by domain, title, or URL..." autocomplete="off">
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width: 45%;">Recorded Website / Target</th>
          <th style="width: 25%;">Timestamp</th>
          <th style="width: 15%;">Details</th>
          <th style="width: 15%; text-align: right;">Action</th>
        </tr>
      </thead>
      <tbody id="recordings-body">
        <tr>
          <td colspan="4" class="empty-state">
            <h3>Loading history...</h3>
            <p>Retrieving your recorded sessions from extension storage and GitHub.</p>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module" src="recordings.js"></script>
</body>
</html>
